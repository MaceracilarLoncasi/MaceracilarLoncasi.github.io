<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Varlık Kağıdı Oluşturma</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React ve ReactDOM CDNs -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Tarayıcıda JSX dönüşümü için Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- html2canvas CDN for PNG export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
      /* Google Fonts'tan Inter yazı tipi */
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
      body {
          font-family: 'Inter', sans-serif;
      }
      /* Daha iyi görünüm için özel kaydırma çubuğu */
      ::-webkit-scrollbar {
          width: 8px;
          height: 8px;
      }
      ::-webkit-scrollbar-track {
          background: #f1f1f1;
          border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb {
          background: #888;
          border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
          background: #555;
      }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Yardımcı fonksiyon: Kabiliyet puanını D&D 5e Ability Modifiers tablosuna göre etkene dönüştürür.
        const calculateModifier = (score) => {
          if (score === 1) return -5;
          if (score >= 2 && score <= 3) return -4;
          if (score >= 4 && score <= 5) return -3;
          if (score >= 6 && score <= 7) return -2;
          if (score >= 8 && score <= 9) return -1;
          if (score >= 10 && score <= 11) return 0;
          if (score >= 12 && score <= 13) return 1;
          if (score >= 14 && score <= 15) return 2;
          if (score >= 16 && score <= 17) return 3;
          if (score >= 18 && score <= 19) return 4;
          if (score >= 20 && score <= 21) return 5;
          if (score >= 22 && score <= 23) return 6;
          if (score >= 24 && score <= 25) return 7;
          if (score >= 26 && score <= 27) return 8;
          if (score >= 28 && score <= 29) return 9;
          if (score === 30) return 10;
          return 0; // Geçersiz veya beklenmeyen puanlar için varsayılan
        };

        // Yardımcı fonksiyon: Sayısal bir modifikatörü string olarak döndürür (+/- ön ekiyle).
        // Bu fonksiyon artık sadece hesaplanmış modifikatör değerlerini bekler.
        const formatModifier = (mod) => {
          return mod >= 0 ? `+${mod}` : `${mod}`;
        };

        // Yetenek Tanımları: Her yetenek ve ilişkili anahtar istatistiği, Türkçe isimleriyle
        const skillDefinitions = [
            { name: 'Akrobasi', ability: 'dex' },
            { name: 'Aldatma', ability: 'cha' },
            { name: 'Atletizm', ability: 'str' },
            { name: 'Din Kültürü', ability: 'int' },
            { name: 'El Becerisi', ability: 'dex' },
            { name: 'Gizlilik', ability: 'dex' },
            { name: 'Gözdağı', ability: 'cha' },
            { name: 'Hayvan İradesi', ability: 'wis' },
            { name: 'İkna', ability: 'cha' },
            { name: 'İnceleme', ability: 'int' },
            { name: 'Mistik Kültür', ability: 'int' },
            { name: 'Performans', ability: 'cha' },
            { name: 'Sezgi', ability: 'wis' },
            { name: 'Sıhhiye', ability: 'wis' },
            { name: 'Tabiat', ability: 'int' },
            { name: 'Tarih Bilgisi', ability: 'int' },
            { name: 'Tespit', ability: 'wis' },
            { name: 'Yaban İrfanı', ability: 'wis' },
        ].sort((a, b) => a.name.localeCompare(b.name));

        // Boyut seçenekleri
        const sizeOptions = ['Ufacık boy', 'Küçük boy', 'Orta boy', 'Büyük boy', 'Kocaman boy', 'Devasa boy'];

        // Tür seçenekleri
        const typeOptions = ['Balçıksı', 'Bitki', 'Dev', 'Ejderha', 'Elemental', 'Fey', 'Garabet', 'Hayvan', 'Hortlak', 'İnsansı', 'Mahlukat', 'Semavi', 'Yapıntı', 'Zebani', 'Özel Tür'];

        // Ahlaki Yönelim seçenekleri (Boş seçeneği eklendi)
        const alignmentOptions = ['Boş', 'Disiplinli İyi', 'Tarafsız İyi', 'Kaotik İyi', 'Disiplinli Tarafsız', 'Tarafsız', 'Kaotik Tarafsız', 'Disiplinli Kötü', 'Tarafsız Kötü', 'Kaotik Kötü'];

        // Hasar Türleri
        const damageTypesOptions = ['Asit', 'Ateş', 'Çürüme', 'Delme', 'Ezme', 'Güç', 'Kesme', 'Işıltı', 'Psişik', 'Soğuk', 'Ses', 'Yıldırım', 'Zehir'].sort();

        // Durum Türleri
        const conditionTypesOptions = ['Bilinçsiz', 'Bitkin', 'Boğulma', 'Cezbedilme', 'Düşme', 'Etkisiz Halde', 'Felç', 'Görünmez', 'Hasta', 'Kavranma', 'Korkma', 'Kör', 'Lanetli', 'Sağır', 'Sersemleme', 'Sessiz', 'Susuz', 'Taşlaşma', 'Yanma', 'Yerde', 'Kısıtlanma', 'Zehirlenme', 'Dönüşüm'].sort();

        // Dil Kategorileri
        const languageOptions = {
            normal: ['Buçukluk', 'Ortak İşaret Dili', 'Cüce Dili', 'Devce', 'Elfçe', 'Gnomca', 'Goblince', 'Orkça', 'Ortak Dil'].sort(),
            exotic: ['Aarakocra Dili', 'Abis Dili', 'Gith dili', 'Gnolca', 'Kadim Dil', 'Ortakaltı', 'Semavi Dili', 'Silvan', 'Zebanice', 'Uzak Lisan'].sort(),
            special: ['Druid Lisanı', 'Hırsız Argosu'].sort()
        };

        // Zorluk Derecesi'nden Tecrübe Puanı'na (XP) eşleme ve CR seçenekleri
        const crToXp = {
            '0': 10, '1/8': 25, '1/4': 50, '1/2': 100,
            '1': 200, '2': 450, '3': 700, '4': 1100,
            '5': 1800, '6': 2300, '7': 2900, '8': 3900,
            '9': 5000, '10': 5900, '11': 7200, '12': 8400,
            '13': 10000, '14': 11500, '15': 13000, '16': 15000,
            '17': 18000, '18': 20000, '19': 22000, '20': 25000,
            '21': 33000, '22': 41000, '23': 50000, '24': 62000,
            '25': 75000, '26': 90000, '27': 105000, '28': 120000,
            '29': 135000, '30': 155000
        };

        // CR seçeneklerini sıralamak için özel karşılaştırıcı fonksiyon
        const sortCrOptions = (a, b) => {
          const parseCr = (crString) => {
            if (crString.includes('/')) {
              const parts = crString.split('/');
              return parseFloat(parts[0]) / parseFloat(parts[1]);
            }
            return parseFloat(crString);
          };
          return parseCr(a) - parseCr(b);
        };
        const crOptions = Object.keys(crToXp).sort(sortCrOptions);

        // Yardımcı fonksiyon: Zorluk Derecesine göre Yeterlilik Bonusu hesaplar
        const calculateProficiencyBonus = (cr) => {
          const numCr = parseFloat(cr);
          if (isNaN(numCr) && cr !== '1/2' && cr !== '1/4' && cr !== '1/8' && cr !== '0') return 2; // Geçersiz CR için varsayılan

          if (cr === '0' || cr === '1/8' || cr === '1/4' || cr === '1/2' || (numCr >= 1 && numCr <= 4)) return 2;
          if (numCr >= 5 && numCr <= 8) return 3;
          if (numCr >= 9 && numCr <= 12) return 4;
          if (numCr >= 13 && numCr <= 16) return 5;
          if (numCr >= 17 && numCr <= 20) return 6;
          if (numCr >= 21 && numCr <= 24) return 7;
          if (numCr >= 25 && numCr <= 28) return 8;
          if (numCr >= 29) return 9;
          return 2; // Geri dönüş
        };

        // Çoklu Seçim Dropdown Bileşeni
        const MultiSelectDropdown = ({ title, options, selectedValues, onSelectionChange }) => {
          const [isOpen, setIsOpen] = React.useState(false);
          const dropdownRef = React.useRef(null); // Ref for dropdown element

          React.useEffect(() => {
            const handleClickOutside = (event) => {
              if (dropdownRef.current && !dropdownRef.current.contains(event.target)) {
                setIsOpen(false);
              }
            };
            document.addEventListener('mousedown', handleClickOutside);
            return () => {
              document.removeEventListener('mousedown', handleClickOutside);
            };
          }, []); // Empty dependency array means this runs once on mount

          const handleCheckboxChange = (option) => {
            let newSelectedValues;
            if (selectedValues.includes(option)) {
              newSelectedValues = selectedValues.filter((item) => item !== option);
            } else {
              newSelectedValues = [...selectedValues, option];
            }
            onSelectionChange(newSelectedValues);
          };

          return (
            <div className="relative" ref={dropdownRef}>
              <button
                type="button"
                className="w-full px-3 py-2 border border-gray-300 rounded-md bg-white text-left focus:outline-none focus:ring-2 focus:ring-blue-500 flex justify-between items-center"
                onClick={() => setIsOpen(!isOpen)}
              >
                <span>{selectedValues.length > 0 ? selectedValues.join(', ') : title}</span>
                <span className="ml-2">&#9662;</span> {/* Aşağı ok */}
              </button>
              {isOpen && (
                <div className="absolute z-10 w-full mt-1 bg-white border border-gray-300 rounded-md shadow-lg max-h-60 overflow-y-auto">
                  {options.map((option) => (
                    <label key={option} className="flex items-center px-3 py-2 hover:bg-gray-100 cursor-pointer">
                      <input
                        type="checkbox"
                        checked={selectedValues.includes(option)}
                        onChange={() => handleCheckboxChange(option)}
                        className="mr-2"
                      />
                      {option}
                    </label>
                  ))}
                </div>
              )}
            </div>
          );
        };

        // Bilgilendirme/Hata Mesaj Kutusu Bileşeni
        const MessageBox = ({ message, type, onClose }) => {
          const bgColor = type === 'error' ? 'bg-red-100 border-red-400 text-red-700' : 'bg-blue-100 border-blue-400 text-blue-700';
          const textColor = type === 'error' ? 'text-red-700' : 'text-blue-700';

          return (
            <div className={`fixed inset-0 bg-gray-600 bg-opacity-50 flex items-center justify-center z-50 p-4`}>
              <div className={`relative bg-white rounded-lg shadow-xl p-6 border ${bgColor} max-w-sm w-full`}>
                <p className={`font-semibold text-lg mb-4 ${textColor}`}>{message}</p>
                <button
                  onClick={onClose}
                  className="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-md transition-colors duration-200"
                >
                  Kapat
                </button>
              </div>
            </div>
          );
        };

        // Ana uygulama bileşeni
        const App = () => {
          const [monster, setMonster] = React.useState({
            name: 'Goblin',
            size: sizeOptions[2], // Orta boy
            type: typeOptions[9], // İnsansı
            customType: '',
            subtype: '',
            alignment: alignmentOptions[7], // Tarafsız Kötü
            ac: '15 (Deri Zırh, Kalkan)',
            hp: '7 (2d6)',
            speed: '30 fit',
            str: 10,
            dex: 14,
            con: 10,
            int: 10,
            wis: 8,
            cha: 8,
            cr: '1/4',
            saves: [], // Kurtarma atışları artık çoklu seçim olacak
            skills: [{ name: skillDefinitions[0].name, bonus: 0 }], // Varsayılan yeteneği skillDefinitions'tan al
            damageVulnerabilities: [],
            damageResistances: [],
            damageImmunities: [],
            conditionImmunities: [],
            senses: {
              hasgoru: '',
              karagoru: '',
              korgoru: '',
              yerhissi: '',
              passivePerception: 0, // Otomatik hesaplanacak
              otherSenses: '',
            },
            languages: {
              normal: [],
              exotic: [],
              special: [],
              custom: '',
            },
            abilities: [
              { name: 'Çevik Kaçış', description: 'Goblin, her sırasında Bonus Aksiyon olarak Serbest Kal veya Saklan aksiyonunu gerçekleştirebilir.' },
            ],
            actions: [
              { name: 'Pala', description: 'Yakın Dövüş Silah Saldırısı: +4 isabetli, 5 fit menzil, bir hedef. Hasar: 5 (1z6 + 2) kesme hasarı.' },
              { name: 'Kısa Yay', description: 'Menzilli Silah Saldırısı: +4 isabetli, 80/320 fit menzil, bir hedef. Hasar: 5 (1z6 + 2) delme hasarı.' },
            ],
            bonusActions: [],
            reactions: [],
            mythicActions: [], // Mitik Aksiyonlar
            legendaryActions: [],
          });

          const [proficiencyBonus, setProficiencyBonus] = React.useState(2);
          const [generatedLore, setGeneratedLore] = React.useState(''); // Oluşturulan hikaye/açıklama
          const [isLoadingLore, setIsLoadingLore] = React.useState(false); // Hikaye yükleme durumu
          const [loreError, setLoreError] = React.useState(''); // Hikaye hata mesajı
          const [isLoadingPng, setIsLoadingPng] = React.useState(false); // PNG yükleme durumu
          const [pngError, setPngError] = React.useState(''); // PNG hata mesajı
          const [showFinishedMessage, setShowFinishedMessage] = React.useState(false); // Bitti mesajı görünürlüğü
          const [finishedMessageContent, setFinishedMessageContent] = React.useState(''); // Bitti mesaj içeriği

          const previewRef = React.useRef(null); // Preview alanına erişim için ref

          // Zorluk Derecesi değiştikçe Yeterlilik Bonusu'nu ve Pasif Tespit'i güncelle
          React.useEffect(() => {
            setProficiencyBonus(calculateProficiencyBonus(monster.cr));
            setMonster(prev => ({
              ...prev,
              senses: {
                ...prev.senses,
                passivePerception: 10 + calculateModifier(prev.wis) + calculateProficiencyBonus(prev.cr)
              }
            }));
          }, [monster.cr, monster.wis]);

          // Form alanları için genel değişiklik işleyici
          const handleChange = (e) => {
            const { name, value } = e.target;
            setMonster(prev => ({
              ...prev,
              [name]: name.match(/^(str|dex|con|int|wis|cha)$/) ? parseInt(value, 10) || 0 : value
            }));
          };

          // Nested objelerdeki değişiklikleri işleyici (örn: senses)
          const handleNestedChange = (parentKey, childKey, value) => {
            setMonster(prev => ({
              ...prev,
              [parentKey]: {
                ...prev[parentKey],
                [childKey]: value
              }
            }));
          };

          // Çoklu seçim alanları için değişiklik işleyici
          const handleMultiSelectChange = (key, selectedOptions) => {
            setMonster(prev => ({
              ...prev,
              [key]: selectedOptions
            }));
          };

          // Dil kategorileri için çoklu seçim değişiklik işleyici
          const handleLanguageSelectChange = (category, selectedOptions) => {
            setMonster(prev => ({
              ...prev,
              languages: {
                ...prev.languages,
                [category]: selectedOptions
              }
            }));
          };

          // Dinamik dizi alanları için değişiklik işleyici (Özellikler, Aksiyonlar, vb.)
          const handleArrayChange = (index, field, value, type) => {
            setMonster(prev => {
              const newArray = [...prev[type]];
              newArray[index] = { ...newArray[index], [field]: value };
              return { ...prev, [type]: newArray };
            });
          };

          // Yetenekler için özel değişiklik işleyici
          const handleSkillChange = (index, field, value) => {
            setMonster(prev => {
              const newSkills = [...prev.skills];
              newSkills[index] = { ...newSkills[index], [field]: value };
              return { ...prev, skills: newSkills };
            });
          };

          // Dinamik dizi alanlarına yeni öğe ekle
          const addArrayItem = (type) => {
            if (type === 'skills') {
              setMonster(prev => ({
                ...prev,
                skills: [...prev.skills, { name: skillDefinitions[0].name, bonus: 0 }] // İlk yeteneği varsayılan olarak al
              }));
            } else {
              setMonster(prev => ({
                ...prev,
                [type]: [...prev[type], { name: '', description: '' }]
              }));
            }
          };

          // Dinamik dizi alanlarından öğe kaldır
          const removeArrayItem = (index, type) => {
            setMonster(prev => {
              const newArray = [...prev[type]];
              newArray.splice(index, 1);
              return { ...prev, [type]: newArray };
            });
          };

          // Gemini API kullanarak canavar hikayesi/açıklaması oluşturma
          const generateMonsterLore = async () => {
              // Bu fonksiyon artık doğrudan çağrılmayacak, butonu devre dışı bırakıyoruz.
              // Ancak yine de hata yönetimi ve loading state'i burada kalabilir,
              // eğer ileride tekrar aktif hale getirilmek istenirse.
              setIsLoadingLore(true);
              setLoreError('');
              setGeneratedLore(''); 
              try {
                  setLoreError('Hikaye oluşturma özelliği şu an için devre dışı bırakıldı. Yakında aktif olacak.');
              } catch (error) {
                  setLoreError('Bir hata oluştu.');
              } finally {
                  setIsLoadingLore(false);
              }
          };

          // Varlık Kağıdını Kaydet
          const handleSaveMonster = () => {
              try {
                  const monsterData = JSON.stringify(monster, null, 2); // 2 boşluklu formatta JSON
                  const blob = new Blob([monsterData], { type: 'application/json' });
                  const url = URL.createObjectURL(blob);
                  const a = document.createElement('a');
                  a.href = url;
                  a.download = `${monster.name.toLowerCase().replace(/\s/g, '-') || 'varlik'}.monster`;
                  document.body.appendChild(a);
                  a.click();
                  document.body.removeChild(a);
                  URL.revokeObjectURL(url);
                  setFinishedMessageContent(`Varlık kağıdı "${a.download}" olarak başarıyla kaydedildi.`);
                  setShowFinishedMessage(true);
              } catch (error) {
                  setLoreError(`Varlık kağıdı kaydedilirken hata oluştu: ${error.message}`);
                  setShowFinishedMessage(true);
              }
          };

          // Varlık Kağıdını Yükle
          const handleLoadMonster = (event) => {
              const file = event.target.files[0];
              if (!file) {
                  return;
              }
              if (!file.name.endsWith('.monster')) {
                  setLoreError('Lütfen ".monster" uzantılı bir dosya seçin.');
                  setShowFinishedMessage(true);
                  return;
              }

              const reader = new FileReader();
              reader.onload = (e) => {
                  try {
                      const loadedMonster = JSON.parse(e.target.result);
                      // Yüklenen verinin beklenen yapıda olup olmadığını kontrol etmek iyi bir fikir
                      if (loadedMonster.name && loadedMonster.size && loadedMonster.type && loadedMonster.str !== undefined) {
                           setMonster({
                              ...monster, // Mevcut varsayılanları koru
                              ...loadedMonster,
                              skills: loadedMonster.skills || [],
                              abilities: loadedMonster.abilities || [],
                              actions: loadedMonster.actions || [],
                              bonusActions: loadedMonster.bonusActions || [],
                              reactions: loadedMonster.reactions || [],
                              legendaryActions: loadedMonster.legendaryActions || [],
                              mythicActions: loadedMonster.mythicActions || [], // Mitik aksiyonlar da eklendi
                              damageVulnerabilities: loadedMonster.damageVulnerabilities || [],
                              damageResistances: loadedMonster.damageResistances || [],
                              damageImmunities: loadedMonster.damageImmunities || [],
                              conditionImmunities: loadedMonster.conditionImmunities || [],
                              languages: loadedMonster.languages || { normal: [], exotic: [], special: [], custom: '' },
                              senses: loadedMonster.senses || {hasgoru: '', karagoru: '', korgoru: '', yerhissi: '', passivePerception: 0, otherSenses: ''},
                              saves: loadedMonster.saves || [],
                          });
                          setFinishedMessageContent(`Varlık kağıdı "${file.name}" başarıyla yüklendi.`);
                          setShowFinishedMessage(true);
                      } else {
                          setLoreError('Yüklenen dosya geçerli bir varlık kağıdı formatında değil.');
                          setShowFinishedMessage(true);
                      }
                  } catch (error) {
                      setLoreError(`Dosya okunurken veya ayrıştırılırken hata oluştu: ${error.message}`);
                      setShowFinishedMessage(true);
                  }
              };
              reader.readAsText(file);
          };

          // Karakter Kağıdını PNG Olarak Kaydet
          const handleExportPng = async () => {
              if (!previewRef.current) {
                  setPngError('Önizleme alanı bulunamadı.');
                  return;
              }

              setIsLoadingPng(true);
              setPngError('');

              try {
                  // html2canvas ile önizleme alanını yakala
                  const canvas = await html2canvas(previewRef.current, {
                      scale: 2, // Daha yüksek çözünürlük için ölçek
                      useCORS: true, // Eğer harici kaynaklar varsa gerekli olabilir
                      logging: false, // Konsol çıktısını azalt
                  });

                  // Canvas'ı PNG veri URL'sine dönüştür
                  const imageDataUrl = canvas.toDataURL('image/png');

                  // PNG dosyasını indirmek için sahte bir bağlantı oluştur
                  const a = document.createElement('a');
                  a.href = imageDataUrl;
                  a.download = `${monster.name.toLowerCase().replace(/\s/g, '-') || 'varlik-kagit'}.png`;
                  document.body.appendChild(a); // Bağlantıyı DOM'a ekle (indirme tetiklemek için)
                  a.click(); // İndirmeyi tetikle
                  document.body.removeChild(a); // Bağlantıyı DOM'dan kaldır

                  setFinishedMessageContent('Varlık kağıdı PNG olarak başarıyla dışa aktarıldı!');
                  setShowFinishedMessage(true);

              } catch (error) {
                  console.error("PNG dışa aktarma hatası:", error);
                  setPngError(`PNG dışa aktarılırken bir hata oluştu: ${error.message}. Tarayıcı izinlerini veya içeriği kontrol edin.`);
                  setShowFinishedMessage(true);
              } finally {
                  setIsLoadingPng(false);
              }
          };


          // Canavar bloğu bölüm başlığı bileşeni
          const MonsterBlockSection = ({ title, children }) => (
            <div className="border-b border-gray-400 pb-2 mb-2">
              <h3 className="font-bold text-lg text-red-700 font-serif">{title}</h3>
              {children}
            </div>
          );

          return (
            <div className="min-h-screen bg-gray-100 p-4 font-inter">
              <h1 className="text-4xl font-bold text-center mb-6 text-gray-800">Varlık Kağıdı Oluştur</h1>

              {/* Yeni butonlar */}
              <div className="flex flex-wrap justify-center gap-4 mb-8">
                  <button
                      onClick={handleSaveMonster}
                      className="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-md transition-colors duration-200"
                  >
                      Varlık Kağıdını Kaydet
                  </button>
                  <label className="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded-md transition-colors duration-200 cursor-pointer">
                      Varlık Kağıdını Yükle
                      <input type="file" accept=".monster" className="hidden" onChange={handleLoadMonster} />
                  </label>
                  <button
                      onClick={handleExportPng}
                      disabled={isLoadingPng}

                    className="w-full bg-green-500 hover:bg-green-600 text-white py-2 rounded-md transition-colors duration-200 mt-2"
                  >
                    Mitik Aksiyon Ekle
                  </button>
                </div>

                {/* Varlık Bloğu Önizlemesi */}
                <div ref={previewRef} className="bg-white p-6 rounded-lg shadow-xl lg:w-1/2 overflow-auto max-h-[90vh]">
                  <h2 className="text-3xl font-bold font-serif text-gray-800 border-b-2 border-red-700 pb-2 mb-4">
                    {monster.name}
                  </h2>
                  <p className="text-sm italic mb-4">
                    {monster.size} {monster.type === 'Özel Tür' ? monster.customType : monster.type}
                    {monster.subtype && ` (${monster.subtype})`}, {monster.alignment === 'Boş' ? '' : monster.alignment}
                  </p>

                  <MonsterBlockSection title="Zırh Sınıfı">
                    <p>{monster.ac}</p>
                  </MonsterBlockSection>
                  <MonsterBlockSection title="Sağlık Puanı">
                    <p>{monster.hp}</p>
                  </MonsterBlockSection>
                  <MonsterBlockSection title="Hız">
                    <p>{monster.speed}</p>
                  </MonsterBlockSection>

                  {/* Kabiliyetler */}
                  <MonsterBlockSection title="Kabiliyetler">
                    <div className="grid grid-cols-3 gap-2 text-center text-sm">
                      <div><strong className="font-bold">KUV</strong><br/>{monster.str} ({formatModifier(calculateModifier(monster.str))})</div>
                      <div><strong className="font-bold">ÇEV</strong><br/>{monster.dex} ({formatModifier(calculateModifier(monster.dex))})</div>
                      <div><strong className="font-bold">DAY</strong><br/>{monster.con} ({formatModifier(calculateModifier(monster.con))})</div>
                      <div><strong className="font-bold">ZEK</strong><br/>{monster.int} ({formatModifier(calculateModifier(monster.int))})</div>
                      <div><strong className="font-bold">BİL</strong><br/>{monster.wis} ({formatModifier(calculateModifier(monster.wis))})</div>
                      <div><strong className="font-bold">KAR</strong><br/>{monster.cha} ({formatModifier(calculateModifier(monster.cha))})</div>
                    </div>
                  </MonsterBlockSection>

                  {monster.saves.length > 0 && (
                    <MonsterBlockSection title="Kurtarma Atışları">
                      <p>
                        {monster.saves.map(save => {
                          let abilityScore;
                          switch (save) {
                            case 'Kuvvet': abilityScore = monster.str; break;
                            case 'Çeviklik': abilityScore = monster.dex; break;
                            case 'Dayanıklılık': abilityScore = monster.con; break;
                            case 'Zeka': abilityScore = monster.int; break;
                            case 'Bilgelik': abilityScore = monster.wis; break;
                            case 'Karizma': abilityScore = monster.cha; break;
                            default: abilityScore = 0;
                          }
                          return `${save} ${formatModifier(calculateModifier(abilityScore) + proficiencyBonus)}`;
                        }).join(', ')}
                      </p>
                    </MonsterBlockSection>
                  )}
                  {monster.skills.length > 0 && (
                    <MonsterBlockSection title="Yetenekler">
                      {monster.skills.map((skill) => { 
                        const associatedAbility = skillDefinitions.find(s => s.name === skill.name)?.ability;
                        const calculatedModifier = associatedAbility ? calculateModifier(monster[associatedAbility]) : 0;
                        const totalBonus = calculatedModifier + proficiencyBonus + (skill.bonus || 0);
                        return (
                          <p key={skill.name} className="mb-1">
                            <strong className="font-bold">{skill.name}</strong> {formatModifier(totalBonus)}
                          </p>
                        );
                      })}
                    </MonsterBlockSection>
                  )}
                  {monster.damageVulnerabilities.length > 0 && (
                    <MonsterBlockSection title="Hasar Savunmasızlıkları">
                      <p>{monster.damageVulnerabilities.join(', ')}</p>
                    </MonsterBlockSection>
                  )}
                  {monster.damageResistances.length > 0 && (
                    <MonsterBlockSection title="Hasar Dirençleri">
                      <p>{monster.damageResistances.join(', ')}</p>
                    </MonsterBlockSection>
                  )}
                  {monster.damageImmunities.length > 0 && (
                    <MonsterBlockSection title="Hasar Bağışıklıkları">
                      <p>{monster.damageImmunities.join(', ')}</p>
                    </MonsterBlockSection>
                  )}
                  {monster.conditionImmunities.length > 0 && (
                    <MonsterBlockSection title="Durum Bağışıklıkları">
                      <p>{monster.conditionImmunities.join(', ')}</p>
                    </MonsterBlockSection>
                  )}
                  {(monster.senses.hasgoru || monster.senses.karagoru || monster.senses.korgoru || monster.senses.yerhissi || monster.senses.otherSenses) && (
                    <MonsterBlockSection title="Algılar">
                      <p>
                        {[
                          monster.senses.hasgoru ? `Hasgörü ${monster.senses.hasgoru} fit` : '',
                          monster.senses.karagoru ? `Karagörü ${monster.senses.karagoru} fit` : '',
                          monster.senses.korgoru ? `Körgörü ${monster.senses.korgoru} fit` : '',
                          monster.senses.yerhissi ? `Yerhissi ${monster.senses.yerhissi} fit` : '',
                          monster.senses.otherSenses,
                          `Pasif Tespit ${monster.senses.passivePerception}`, // Label changed to Pasif Tespit
                        ].filter(Boolean).join(', ')}
                      </p>
                    </MonsterBlockSection>
                  )}
                  { (monster.languages.normal.length > 0 || monster.languages.exotic.length > 0 || monster.languages.special.length > 0 || monster.languages.custom) && (
                    <MonsterBlockSection title="Diller">
                      <p>
                        {[
                          ...monster.languages.normal,
                          ...monster.languages.exotic,
                          ...monster.languages.special,
                          monster.languages.custom,
                        ].filter(Boolean).join(', ')}
                      </p>
                    </MonsterBlockSection>
                  )}

                  <MonsterBlockSection title="Tehdit Derecesi">
                    <p>
                      {monster.cr} ({crToXp[monster.cr] ? crToXp[monster.cr] : 'N/A'} XP)
                    </p>
                  </MonsterBlockSection>
                  <MonsterBlockSection title="Yeterlilik Bonusu">
                    <p>+{proficiencyBonus}</p>
                  </MonsterBlockSection>

                  {/* Yeni: Oluşturulan Hikaye/Açıklama */}
                  {generatedLore && (
                    <MonsterBlockSection title="Hikaye">
                      <p className="whitespace-pre-wrap">{generatedLore}</p>
                    </MonsterBlockSection>
                  )}

                  {/* Özellikler (Traits) */}
                  {monster.abilities.length > 0 && (
                    <MonsterBlockSection title="Özellikler">
                      {monster.abilities.map((ability, index) => (
                        <p key={index} className="mb-1">
                          <strong className="font-bold italic">{ability.name}.</strong> {ability.description}
                        </p>
                      ))}
                    </MonsterBlockSection>
                  )}

                  {/* Aksiyonlar */}
                  {monster.actions.length > 0 && (
                    <MonsterBlockSection title="Aksiyonlar">
                      {monster.actions.map((action, index) => (
                        <p key={index} className="mb-1">
                          <strong className="font-bold italic">{action.name}.</strong> {action.description}
                        </p>
                      ))}
                    </MonsterBlockSection>
                  )}

                  {/* Bonus Aksiyonlar */}
                  {monster.bonusActions.length > 0 && (
                    <MonsterBlockSection title="Bonus Aksiyonlar">
                      {monster.bonusActions.map((action, index) => (
                        <p key={index} className="mb-1">
                          <strong className="font-bold italic">{action.name}.</strong> {action.description}
                        </p>
                      ))}
                    </MonsterBlockSection>
                  )}

                  {/* Reaksiyonlar */}
                  {monster.reactions.length > 0 && (
                    <MonsterBlockSection title="Reaksiyonlar">
                      {monster.reactions.map((action, index) => (
                        <p key={index} className="mb-1">
                          <strong className="font-bold italic">{action.name}.</strong> {action.description}
                        </p>
                      ))}
                    </MonsterBlockSection>
                  )}

                  {/* Efsanevi Aksiyonlar */}
                  {monster.legendaryActions.length > 0 && (
                    <MonsterBlockSection title="Efsanevi Aksiyonlar">
                      <p className="mb-2">Canavarın {monster.name}, {Math.floor(parseFloat(monster.cr.split('/')[0]) / (monster.cr.includes('/') ? parseFloat(monster.cr.split('/')[1]) : 1) / 2)} efsanevi aksiyon hakkına sahiptir.</p>
                      {monster.legendaryActions.map((action, index) => (
                        <p key={index} className="mb-1">
                          <strong className="font-bold italic">{action.name}.</strong> {action.description}
                        </p>
                      ))}
                    </MonsterBlockSection>
                  )}

                  {/* Mitik Aksiyonlar */}
                  {monster.mythicActions.length > 0 && (
                    <MonsterBlockSection title="Mitik Aksiyonlar">
                      <p className="mb-2">Canavarın Mitik Aksiyonları:</p> {/* Mitik Aksiyonlar için giriş cümlesi */}
                      {monster.mythicActions.map((action, index) => (
                        <p key={index} className="mb-1">
                          <strong className="font-bold italic">{action.name}.</strong> {action.description}
                        </p>
                      ))}
                    </MonsterBlockSection>
                  )}
                </div>
              </div>
              {/* Hikaye Oluştur butonu sayfanın en altına taşındı ve devre dışı bırakıldı */}
              <button
                  onClick={generateMonsterLore}
                  disabled={true} // Devre dışı bırakıldı
                  className="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-4 rounded-md mt-8 transition-colors duration-200 flex items-center justify-center disabled:opacity-50 disabled:cursor-not-allowed text-xl"
              >
                  Hikaye Oluştur (Yakında)
              </button>
              {loreError && (
                <p className="text-red-500 text-sm mt-2 text-center">{loreError}</p>
              )}
            </div>
          );
        };

        // React uygulamasını 'root' div'ine render et (React 18 createRoot API'si ile uyumlu)
        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
